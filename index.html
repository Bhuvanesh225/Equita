<!doctype html>
<html lang="en-GB" data-scheme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Equita — make the split visible</title>
    <meta
      name="description"
      content="Equita turns group work into a shared picture of hours, ownership and balance — so students and teachers can act before the deadline."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Equita — make the split visible" />
    <meta
      property="og:description"
      content="A shared-work operating system for student groups and classrooms. See the split, find the pressure, make the move."
    />

    <!--
      The light paper scheme is chosen before the first paint so the first frame
      always matches the product's printed-brief metaphor.
    -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.scheme = "paper";
        } catch (error) {
          document.documentElement.dataset.scheme = "paper";
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1 style="font-size: 1.5rem">Equita</h1>
        <p>
          This application needs JavaScript. It plans project work in hours, places each task with the person who can do it, and
          shows the group when the split has tipped.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
